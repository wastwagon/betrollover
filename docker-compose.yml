# BetRollover v2 - Local Development Stack (PostgreSQL)
# Run: docker compose up -d
# Preview: http://localhost:6002 (web), http://localhost:6001 (API)
# Note: Port 6000 is blocked by Chrome (ERR_UNSAFE_PORT); using 6002

services:
  # PostgreSQL Database (long-term modern stack)
  postgres:
    image: postgres:16-alpine
    container_name: betrollover-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betrollover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betrollover_dev}
      POSTGRES_DB: ${POSTGRES_DB:-betrollover}
    # Load pg_stat_statements; smoother checkpoints during fixture/odds sync bursts (see database/init/15-pg-stat-statements.sql).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
    # Expose for Docker Desktop / GUI. Use 5434 if 5433 is taken by another project (e.g. egp-postgres).
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betrollover} -d ${POSTGRES_DB:-betrollover}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis - caching, sessions, real-time
  redis:
    image: redis:7-alpine
    container_name: betrollover-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Exposed for local API dev when Docker build fails
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis.conf:ro
    command: ["redis-server", "/etc/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API Backend
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: betrollover-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-6001}:3001"  # Host 6001 (6xxx range)
    environment:
      NODE_ENV: development
      PORT: 3001
      # Backend uses POSTGRES_HOST/PORT (not DATABASE_URL) - must use Docker service name
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-betrollover}:${POSTGRES_PASSWORD:-betrollover_dev}@postgres:5432/${POSTGRES_DB:-betrollover}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      # API-Sports key — reads from .env (leave empty in .env to disable live fetching in dev)
      API_SPORTS_KEY: ${API_SPORTS_KEY:-}
      API_SPORTS_PLAN: ${API_SPORTS_PLAN:-ultra}
      API_SYNC_LOOKAHEAD_DAYS: ${API_SYNC_LOOKAHEAD_DAYS:-3}
      API_MAX_ODDS_EVENTS_PER_RUN: ${API_MAX_ODDS_EVENTS_PER_RUN:-0}
      API_MAX_FOOTBALL_ODDS_FIXTURES: ${API_MAX_FOOTBALL_ODDS_FIXTURES:-0}
      API_MAX_LEAGUE_BACKFILL_PER_RUN: ${API_MAX_LEAGUE_BACKFILL_PER_RUN:-100}
      API_CALL_DELAY_MS: ${API_CALL_DELAY_MS:-50}
      API_PREDICTION_DELAY_MS: ${API_PREDICTION_DELAY_MS:-50}
      API_MAX_FIXTURES_UPDATE_PER_RUN: ${API_MAX_FIXTURES_UPDATE_PER_RUN:-200}
      CLEANUP_NO_ODDS_FIXTURES: ${CLEANUP_NO_ODDS_FIXTURES:-true}
      # The Odds API key — all sports except football (basketball, rugby, mma, hockey, american football, tennis)
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      TENNIS_ODDS_API_KEY: ${TENNIS_ODDS_API_KEY:-}  # legacy fallback — use ODDS_API_KEY going forward
      # Comma-separated list of enabled sports. Football is always included.
      ENABLED_SPORTS: ${ENABLED_SPORTS:-football}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-false}
      ENABLE_SCHEDULING: ${ENABLE_SCHEDULING:-true}
      PREDICTION_TIMEZONE: ${PREDICTION_TIMEZONE:-Africa/Accra}
      PREDICTION_DAILY_CRON: ${PREDICTION_DAILY_CRON:-0 20 * * *}
      ACCA_DESK_ENABLED: ${ACCA_DESK_ENABLED:-true}
      ACCA_DESK_DAILY_CRON: ${ACCA_DESK_DAILY_CRON:-30 0 * * *}
      ACCA_DESK_EARLY_CRON: ${ACCA_DESK_EARLY_CRON:-0 20 * * *}
      ACCA_DESK_EARLY_ENABLED: ${ACCA_DESK_EARLY_ENABLED:-true}
      HIDE_CLASSIC_AI_TIPSTERS_FROM_PUBLIC: ${HIDE_CLASSIC_AI_TIPSTERS_FROM_PUBLIC:-true}
      PREDICTION_CATCHUP_CRON: ${PREDICTION_CATCHUP_CRON:-0 2 * * *}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@betrollover.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:6002}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      MIGRATIONS_PATH: /app/database/migrations
      SEEDS_PATH: /app/database/seeds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src  # Live reload source only; use image's node_modules
      - ./database/migrations:/app/database/migrations  # For automatic migrations on startup
      - ./database/seeds:/app/database/seeds  # For seed runner on startup

  # Next.js Web App (mobile-first)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: betrollover-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6002}:3000"  # Host 6002 (6000 blocked by Chrome)
    environment:
      NODE_ENV: development
      # Client-side: browser fetches API at this URL
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:6001}
      # Canonical app URL - used for login redirects (avoids wrong port e.g. 3000 vs 6002)
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:6002}
      APP_URL: ${APP_URL:-http://localhost:6002}
      NEXT_PUBLIC_FOOTBALL_ONLY_DISCOVERY: ${NEXT_PUBLIC_FOOTBALL_ONLY_DISCOVERY:-true}
      FOOTBALL_ONLY_DISCOVERY: ${FOOTBALL_ONLY_DISCOVERY:-true}
      NEXT_PUBLIC_SUBSCRIPTIONS_ENABLED: ${NEXT_PUBLIC_SUBSCRIPTIONS_ENABLED:-false}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-false}
      # Server-side: web container must reach api via Docker network (not localhost)
      BACKEND_URL: http://api:3001
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      # Host package path for file:../packages/shared-types symlink inside node_modules
      - ./packages:/packages
      # .next is a named Docker volume so it lives inside the Linux VM (not the macOS
      # host bind mount). This eliminates osxfs/virtiofs sync issues that cause webpack
      # to read stale/incomplete chunk files and throw "Cannot read properties of
      # undefined (reading 'call')".
      - betrollover_web_next:/app/.next

volumes:
  postgres_data:
  redis_data:
  betrollover_web_next:
